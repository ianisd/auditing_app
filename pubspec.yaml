name: counting_app
description: "Offline Stock Counting App"
publish_to: 'none'
version: 1.0.1+26

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # For CSV upload
  file_picker: ^8.0.0

  # ✅ ADD THIS FOR firstOrNull EXTENSION (optional but clean)
  collection: ^1.18.0

  # State Management
  provider: ^6.1.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0

  # HTTP & Networking
  dio: ^5.6.0
  http: ^1.2.1
  connectivity_plus: ^7.0.0

  # Firebase Integration
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1

  # Utilities
  uuid: ^4.5.0
  intl: ^0.20.2
  csv: ^6.0.0

  # UI Components
  table_calendar: ^3.0.13


  # Barcode Scanning (UPDATED VERSION)
  mobile_scanner: ^7.1.4  # Updated: Better than barcode_scan2
  camera: ^0.11.1+1

  # Icons
  cupertino_icons: ^1.0.6

  # Desktop support
  window_manager: ^0.4.3
  data_table_2: ^2.5.12
  desktop_drop: ^0.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.0

  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

  flutter_lints: ^6.0.0

  connectivity_plus_platform_interface: any
  msix: ^3.18.0
flutter:
  uses-material-design: true

  assets:
   - assets/csv/